# Template — copy to k8s/secrets.yaml (gitignored) and replace placeholders.
# `make secrets` does this automatically with cryptographically-random values.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: team-manager
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME_POSTGRES_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: team-manager
type: Opaque
stringData:
  DATABASE_URL: postgres://team-manager:CHANGE_ME_POSTGRES_PASSWORD@postgres.team-manager.svc.cluster.local:5432/team-manager
  JWT_SECRET: CHANGE_ME_JWT_SECRET
---
apiVersion: v1
kind: Secret
metadata:
  name: openobserve-secret
  namespace: team-manager
type: Opaque
stringData:
  password: CHANGE_ME_OO_PASSWORD
