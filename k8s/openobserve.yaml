apiVersion: v1
kind: Service
metadata:
  name: openobserve
  namespace: team-manager
  labels:
    app.kubernetes.io/name: openobserve
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: team-manager
spec:
  type: ClusterIP
  selector:
    app: openobserve
  ports:
    - name: http
      port: 5080
      targetPort: 5080
    - name: otlp-grpc
      port: 5081
      targetPort: 5081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openobserve
  namespace: team-manager
  labels:
    app.kubernetes.io/name: openobserve
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: team-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openobserve
  template:
    metadata:
      labels:
        app: openobserve
        app.kubernetes.io/name: openobserve
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: team-manager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: openobserve
          image: public.ecr.aws/zinclabs/openobserve:v0.90.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5080
              name: http
            - containerPort: 5081
              name: otlp-grpc
          env:
            - name: ZO_ROOT_USER_EMAIL
              value: admin@example.local
            - name: ZO_ROOT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openobserve-secret
                  key: password
            - name: ZO_DATA_DIR
              value: /data
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5080
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
