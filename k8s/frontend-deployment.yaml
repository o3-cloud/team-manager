apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: team-manager
data:
  default.conf: |
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers — applied to all responses including errors. Note: if a location
        # block adds its own `add_header`, nginx stops inheriting these for that location,
        # so keep `add_header` out of the proxy locations below.
        # CSP allows the inline RUM bootstrap and connections back to our own origin (the
        # nginx /rum/ proxies handle the round-trip to OpenObserve).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; worker-src 'self' blob:" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend.team-manager.svc.cluster.local:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # OpenObserve RUM ingest to centralized OO.
        # OO v0.90.2 uses ?oo-api-key for auth. The trailing ? in the rewrite suppresses original args.
        location /rum/ {
            rewrite ^(/rum/.+)$ $1?oo-api-key=rumXigFGC91pUcnbC4m? break;
            proxy_pass http://o2-openobserve-standalone.openobserve.svc.cluster.local:5080;
            proxy_http_version 1.1;
            proxy_set_header Host o2-openobserve-standalone.openobserve.svc.cluster.local;
        }

        location /api/default/rum/ {
            rewrite ^(/api/default/rum/.+)$ $1?oo-api-key=rumXigFGC91pUcnbC4m? break;
            proxy_pass http://o2-openobserve-standalone.openobserve.svc.cluster.local:5080;
            proxy_http_version 1.1;
            proxy_set_header Host o2-openobserve-standalone.openobserve.svc.cluster.local;
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: team-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: frontend
          image: team-manager-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: team-manager
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-manager-ingress
  namespace: team-manager
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: team-manager.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
