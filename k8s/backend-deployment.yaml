apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: team-manager
data:
  NODE_ENV: production
  CORS_ORIGIN: https://team-manager.example.com
  OTEL_EXPORTER_OTLP_ENDPOINT: http://o2c-openobserve-collector-gateway-collector.openobserve-collector.svc.cluster.local:4318
  OTEL_SERVICE_NAME: team-manager-backend
  OTEL_RESOURCE_ATTRIBUTES: k8s.cluster.name=docker-desktop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: team-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend
          image: team-manager-backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: team-manager
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
