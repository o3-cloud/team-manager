server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — applied to all responses including errors. Note: if a location
    # block adds its own `add_header`, nginx stops inheriting these for that location,
    # so keep `add_header` out of the proxy locations below.
    # CSP allows the inline RUM bootstrap and connections back to our own origin (the
    # nginx /rum/ proxies handle the round-trip to OpenObserve).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend.team-manager.svc.cluster.local:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # OpenObserve RUM ingest — browser RUM/logs SDKs POST to these paths.
    # Auth: the RUM `clientToken` configured in src/telemetry.ts is the credential
    # OpenObserve checks; we deliberately do NOT inject a Basic-auth header here.
    location /rum/ {
        proxy_pass http://openobserve.team-manager.svc.cluster.local:5080/rum/;
        proxy_http_version 1.1;
        proxy_set_header Host openobserve.team-manager.svc.cluster.local;
    }

    location /api/default/rum/ {
        proxy_pass http://openobserve.team-manager.svc.cluster.local:5080/api/default/rum/;
        proxy_http_version 1.1;
        proxy_set_header Host openobserve.team-manager.svc.cluster.local;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
